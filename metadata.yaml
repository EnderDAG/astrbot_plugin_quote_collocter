name: quote_collocter
display_name: 语录收集器
short_desc: "群友语录投稿、随机抽取与 AI 语义检索，配套人物档案、统计周报与 WebUI 管理页。"
desc: |
  把群友的「黑历史」变成随时能翻出来鞭尸的语录库。装上它，群友的逆天发言、名场面截图都会被收进本地数据库，支持随机抽取、AI 语义检索、人物档案、统计周报，以及一套完整的 WebUI 管理后台。

  ## 核心功能

  - **截图投稿**：群内发送「语录投稿」+ 图片即可收录，支持引用投稿与冷却防刷屏，也可以由管理员在管理页直接上传。
  - **随机抽取**：`/语录`、戳一戳机器人、`/今日语录` 随时抽一张；支持按人物、关键词、限制级筛选。
  - **AI 语义召回**：接入 LLM 后，群友说「发一张某某摆烂的语录」，AI 会按语义检索图片并直接发出；也支持自然语言检索与上下文自然引用。
  - **人物档案**：自动识别截图里的说话人并归档，支持昵称别名、头像历史（dHash 指纹）、同人合并/拆分、以图找人；群友换昵称、换头像、换号也能认出是同一个人。
  - **统计与报告**：语录总量、归属率、语义化覆盖率、各群排行；`/周报`、`/年度报告` 生成带头像的表格图与 Wrapped 风格长图。
  - **专题合集**：把语录整理成专题，群内 `/合集 名称` 直接发图。
  - **WebUI 管理页**：语录库、人物、统计、合集、数据可视化、回收站、协作维护七个模块；支持全文检索（FTS5）、批量操作、软删除恢复、自动打标签、热力图与发帖日历。
  - **协作维护**：群主/管理员发放邀请令牌，维护员可在独立协作页处理归属、标签、限制级与语义，所有操作带审计与一键撤销。
  - **限制级规则**：低俗内容可标记为限制级，默认不展示、不随机、AI 不召回，每群可自行开关。

  ## 快速开始

  1. 在 AstrBot 插件市场安装并启用本插件；
  2. 把机器人拉进群，发送「语录投稿」并附上语录截图；
  3. 打开 AstrBot 仪表盘 → 插件 → 语录收集器 → 「语录管理」进入管理页；
  4. 需要 AI 能力时，在群设置里开启「AI 语义化 / 语义召回」，首次开启会自动为历史语录补齐描述与向量。

  ## 常用命令

  | 命令 | 说明 |
  | --- | --- |
  | `/语录` | 随机抽一条本群语录 |
  | `/语录 @某人`、`/语录 关键词` | 按人物或关键词抽取 |
  | `/今日语录`、`/语录排行` | 今日语录、本群排行榜 |
  | `/语录查`、`/语录人物` | 查询与人物档案 |
  | `/周报`、`/年度报告` | 周报图、年度报告长图 |
  | `/合集 名称` | 发送专题合集 |
  | `/限制级 开或关` | 每群限制级开关 |
  | `/维护` | 添加协作维护成员 |

  > 完整命令与权限说明见管理页与仓库 README。

  ## 数据与备份

  - 插件数据位于 AstrBot 的 `data/plugin_data/quote_collocter/`：`quote.db`（SQLite）与 `quotes_data/`（原图、缩略图、周报缓存）。
  - 升级到 v3.0.1 及以后版本后旧版 `data/quotes_data/` 会自动迁移，无需手动处理。
  - 备份时打包 `plugin_data/quote_collocter/` 整个目录即可。

  ## 兼容性

  - AstrBot `>= 4.17, < 5`；Python 依赖见 `requirements.txt`。
  - 所有语录数据保存在本地，不上传云端。

  ## 更新记录

  完整版本历史见 [CHANGELOG.md](https://github.com/EnderDAG/astrbot_plugin_quote_collocter/blob/main/CHANGELOG.md)。

  **v3.0.2**：重写插件市场介绍与群内帮助，改为结构化说明；代码行为与 v3.0.1 一致。

  **v3.0.1**：修复市场审核反馈——日志统一从 `astrbot.api` 导入；语录图片与缩略图迁移到 `plugin_data/quote_collocter/quotes_data` 并自动迁移旧目录；更新推送默认关闭，移除内置群号与跨插件 token 读取。

  ## 开源与反馈

  - GitHub：https://github.com/EnderDAG/astrbot_plugin_quote_collocter
  - 许可证：AGPL-3.0
  - 问题反馈与功能建议欢迎提 Issue 或 PR。
help: |
  发送「语录投稿」+ 图片（或引用图片发送「语录投稿」）即可收录群友语录；发送「/语录」随机查看一条，戳一戳机器人也会随机发一张。

  常用命令：/语录 [@某人|关键词]、/今日语录、/语录查、/语录人物、/语录排行、/周报、/年度报告、/合集 名称、/限制级 开|关、/维护。

  管理员在 AstrBot 仪表盘 → 插件 → 语录收集器 →「语录管理」中打开管理页，可浏览/检索/批量管理语录、维护人物档案、语义化、查看统计与可视化、处理回收站与协作维护。

  开启群设置里的「让 AI 记住发过的语录」「允许 AI 语义召回并发送」后，机器人可以按语义检索并发送语录。

  数据保存在 data/plugin_data/quote_collocter/（quote.db 与 quotes_data/ 图片），备份整个目录即可。
