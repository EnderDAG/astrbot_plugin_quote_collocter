name: quote_collocter
display_name: 语录收集器
short_desc: "群友语录投稿、随机抽取与 AI 语义检索，配套人物档案、统计周报与 WebUI 管理页。"
desc: "可以自行截图并投稿群友的逆天语录，用来日后鞭尸（已支持冷却防刷屏）。v2.0 起自带 WebUI 管理页面，可浏览、检索、批量删除、跨群移动语录并修改群设置；v2.1 起支持一键语义化（视觉描述 + 向量索引）与自然语言语义检索；v2.2 起机器人会记住自己发过的语录，并在后续对话上下文中自然引用；v2.3 修复插件页面在 iframe 沙箱下确认框失效、按钮点击无响应的问题；v2.4 起 AI 可调用 recall_quotes 按语义检索语录图片，并在回复中用 &&候选id&& 标记发送；v2.5 起新增人物档案，按 QQ 号记录昵称与头像历史（dHash 指纹），群友改昵称/换头像后仍能认出同一个人，并支持以图找人、合并/拆分身份；v2.6 起语录按「被拍的人」归档：自动识别截图里的说话人昵称并匹配群成员档案，按人物归纳与浏览语录，也可手动指定归属；v2.6.1 让昵称匹配更宽容（本群→全库→字形相似），并新增「待确认归属」把截图昵称批量绑定到人物、同时记住该昵称。v2.6.2 起可把已识别/指定的人物档案反向回填到语义索引的 speaker（不重算向量），之后语义检索显示与 AI 召回都用规范名；v2.6.3 修复重跑「一键语义化」会冲掉人物归属 speaker 的问题。v2.7 新增昵称别名表：截图里的各种昵称直接映射到 QQ 号，不再写进群名片历史；归属识别先查别名、再做形近匹配，「待确认归属」可把同一人被读错的名字一键归并，并提供「整理旧别名」迁移与清理旧数据。v2.8 让 AI 提到语录人物时使用群昵称（群名片优先）称呼，不再输出 QQ 号或数字 ID：语义召回返回 who 字段，发送记忆里的说话人也用群昵称，查不到时以「群友」代称。v2.8.1 修复 AI 召回「只发文字不发图」：标记只认图片 id、校验放宽到本群已存在的图片、记录无效标记原文，并新增群设置「AI 没写标记时自动补发 top1」。v2.8.2 放宽召回提示词：语录内容再逆天、擦边、露骨也照发，不再审查、劝退或要求换图；群友点名要图时必须发送。v2.9 新增语录统计：管理页「语录统计」汇总语录总量、归属率、语义化覆盖、占用空间、最近 30 天新增与各群概览，并按人物归纳给出语录数量排名和投稿人排名；群内发送「/语录排行」可查看本群排名。v2.9.1 修复群头衔/等级徽章被当成语录归属：识别时忽略 LV、群头衔、身份徽章，别名表加入可信度标记，成员头衔进入屏蔽词，「整理旧别名」会清理头衔别名并解除错误归属。v2.9.2 修复群友改昵称/换号后 AI 召回搜不到其语录的问题：召回时先核对 query 里的 QQ 号，再用该 QQ 的昵称/别名列表识别当事人，直接取出其名下语录。v2.9.3 新增身份自动同步：默认每 24 小时自动同步一次群成员昵称、群名片与头像，周期可在「语录人物」页面调整（1–168 小时）或暂停。v2.9.4 新增更新推送：插件版本更新后经 DSH 桥接向指定群聊发送更新日志（v3.0.1 起默认关闭，需用户显式配置目标群与 token）。v2.9.5 起推送更新日志后，会在该群 AI 上下文中注入近况提示，群友追问更新内容时能自然接话。v2.9.6 新增 quote_stats 工具：AI 统计语录时按人物合并多个昵称，不再把同一人算成多个人。v2.10 起语录人物统一用稳定的 pid 编号管理：昵称、头像、多个 QQ 都归到同一个 pid 下，统计与 AI 召回按 pid 合并。v2.11 起数据存储迁移到 SQLite（plugin_data/quote_collocter/quote.db）：群设置、语录元数据、语义索引、人物档案、发送记忆统一入库，旧 JSON 数据在首次启动时自动导入并保留为备份。v2.12 起补全群内语录命令（点名/关键词/连发、/语录详情、/合集、/周报），新增「专题合集」与「每周语录周报」，并优化 AI 召回（可点名人物、查询周报与合集归属）。v2.12.1 起周报渲染为带头像的表格图片：群内「/周报」直接发图，回复「/周报 上周」可看上一周；管理页「语录统计」的排行与各群概览改为带头像的表格。v2.12.2 起 AI 召回最多返回 3 条精简候选（id/who/pid/caption/tags/tone），并附带最近已发过的图与 sent_ago 标记，避免同一张图反复发送；「/语录排行」支持按月（本月 / 上月）。v2.12.3 起 AI 工具合并为单个 quote（action=recall|stats|weekly），召回候选精简到 3 条、只带 id/who/caption/tags，并新增最近已发图记忆、召回缓存（5 分钟）与召回提示节流（30 分钟）。v2.13 起管理页支持全文检索与组合筛选（关键词走 SQLite FTS5 索引，可按人物 / 标签 / 时间过滤）；删除语录改为先进回收站（软删除，可恢复或彻底删除，按群设置的天数自动清理）；新增后台打标签队列（视觉模型自动为语录补 tags，可在设置里开关与随时暂停）。v2.14 起新增「数据可视化」：管理页可查看时段热力图、发帖日历与人物时间线；群内「/年度报告」或管理页可生成 Wrapped 风格年度语录报告长图（头像、年度排名、逐月走势、高光时刻、代表语录）。v2.14.1 改进更新推送：按条列出精简后的更新要点，条目过多时保留前 6 条并提示查看完整日志，不再只发一句「细节见更新日志」。v2.15.0 新增俗名学习：机器人会从群消息里低频学习群友的俗名/外号，先进入「语录人物」页的「待确认俗名」列表，确认后才写入别名表（QQ > @提及 > 确认别名 > 群名片/昵称历史 > 形近）。v2.16.0 起新增自动语义化（默认每 24 小时为未语义化的新语录补齐描述与向量，周期可在群设置调整）；称呼与归属统一按「确认俗名 → QQ 当前昵称/群名片」优先显示，并支持一键重填全部语录归属。v2.17.0 重做管理页界面：左侧模块导航（语录库 / 语录人物 / 语录统计 / 专题合集 / 数据可视化 / 回收站）独立成模块，按钮按功能分组，视觉改为纸感底色 + 墨黑 + 荧光黄绿的点线面风格；数据可视化的热力图补充星期与时段分布条。v2.17.1 界面细节打磨：配色与字体直接取自模板 PPT 的主题参数（lime #D0E516 / 纸感 #FBF5ED / 墨黑 #111111，主字体思源黑体 CN Heavy），模块改为不透明圆角卡片，关闭页面背景透出与渐变过重的问题，深色模式下同样保持对比度。v2.17.2 起管理页背景为毛玻璃（纸感渐变 + 柔光 + 低密度等高线/不规则涟漪，面板毛玻璃模糊），左侧导航取模板 PPT 的墨黑 + lime 激活块，深色主题为黑玻璃；v2.17.3 管理弹层改为实色面板（遮罩加深 + 模糊加强），避免背后语录干扰阅读；v2.17.4 管理弹层改为半透明黑玻璃，左侧导航不再被遮罩压暗，界面类更新不再自动推送群公告；v2.17.5 管理页性能优化：缩略图内存缓存 + 并发 8、默认每页 24 张、搜索输入防抖、毛玻璃模糊半径下调。；v2.17.6 进一步优化：缩略图降到 320px / 质量 76、语录网格分片渲染（先渲染首屏，其余滚动补）、弹层人物/统计/可视化数据 60–120 秒缓存、取消卡片悬停位移与重阴影。；v2.17.7 语录网格改为真正虚拟列表（固定行高 + 绝对定位，只为视口附近的卡片建 DOM），并在插件启动后后台预生成缺失的缩略图缓存。；v2.17.8 语录网格改为每排最多 5 个、每页最多 3 排：页大小按当前窗口列数自适应（12–15 张），窗口宽度变化时自动重算并重载当前页。；v2.17.9 缩略图改用 WebP（体积更小），新增 `images/batch` 批量取图接口并支持下一页缩略图预取。；v2.17.10 提升滚动与点击流畅度（面板不再使用 backdrop-filter、卡片减少重绘、虚拟列表命中缓存），缩略图清晰度提升到 640px、网格图区加高到 160px。；v2.17.11 优化弹层打开速度：弹层遮罩不再实时模糊、入场改为淡入，头像缩略图改为服务端预生成 96px 缓存并延迟注入。v2.18.0 起支持「限制级 / 非限制级」规则：低俗、不适合直接发到群里的语录可标记为限制级，页面默认只展示非限制级，随机发送与 AI 召回也会跳过限制级。 v2.18.1 起限制级发送改为每群可自行开关（群内发送「/限制级 开 / 关」或页面开关，默认关闭，AI 召回与随机发送都会遵守）。 v2.19.0 起支持群内协作维护：群主/管理员可用「/维护」添加维护成员并邀请其登录独立协作页，处理语录归属/限制级/语义并记录审计。 v2.20.0 起管理页新增「协作维护」模块：可直接查看/添加/移除维护成员、生成 7/30/90 天或长期邀请链接并吊销，审计日志支持一键撤销（恢复归属或限制级到操作前）；邀请令牌与群聊解耦，一个维护者可同时维护多个群并在协作页切换。v2.20.1 起协作维护页支持点击缩略图查看大图（人物/标签/语义状态）、按最新或最早排序、按归属筛选；管理页复制邀请链接在沙箱环境下改为选中兜底。v2.20.2 起协作维护页的图片查看面板内置编辑操作：可直接在面板里标/取消限制级、搜索并归属人物或清除归属，管理角色还可重新语义化。 v2.20.3 起「编辑」「管理」合并为「维护员」（权限一致），协作维护页查看面板支持直接添加/修改标签（逗号分隔，可为该图恢复语义标签），标签改动同样写入审计并支持撤销。 v2.20.4 起协作维护页的标签改为 B 站式独立词条：逐个添加、点 × 删除，可随时保存或恢复语义标签。 v2.20.5 起协作维护页「重新语义化」支持填写可选「参考意见」，视觉模型会据此校正图中人物与情节判断（识别成功后自动清除）。 V3.0.0 起版本号正式升级为 3.0.0，并发布到 AstrBot 插件市场；3.0 汇总了协作维护、限制级规则、语义参考意见、语录统计与年度报告等能力。V3.0.1 修复市场审核反馈：更新推送默认关闭并移除内置群号与跨插件 token 读取；语录图片与缩略图统一迁移到 plugin_data/quote_collocter/quotes_data 并支持旧目录自动迁移；日志统一从 astrbot.api 导入。"
help: "发送「语录投稿+图片」或引用图片发送「语录投稿」来存储群友的黑历史！发送「/语录」随机查看一条；bot 被戳一戳时会随机发送一张语录。管理员可在 AstrBot 仪表盘的插件页面中打开「语录管理」，并在其中一键语义化全部语录；开启群设置里的「让 AI 记住发过的语录」后，机器人发过的语录会进入它自己的上下文；开启「允许 AI 语义召回语录并发送」后，AI 可按语义检索语录图片并随回复发出。管理页面的「语录人物」按人物归纳语录（自动识别截图里的说话人，支持手动指定/批量回填），「人物档案」可同步群友头像与昵称历史、以图找人，并把同一人的多个 QQ 号合并。「回填语义speaker」会把已归属人物的规范昵称写回语义索引，便于 AI 用规范名召回。v2.7 起截图昵称会存成「别名」而不是群名片历史：「待确认归属」里形近的名字可一键归并，「整理旧别名」可迁移旧数据并清理被读错的昵称。v2.8 起 AI 复述语录人物时使用群昵称（群名片优先），不会把 QQ 号直接发出来；历史昵称里没有群昵称的，会在群友下次发言时自动补齐。v2.8.1 起标记只认图片 id（&&image_xxx.jpg&&），无效标记会记录原文；群设置里可开启「AI 没写标记时自动补发 top1」。v2.8.2 起 AI 发语录不再纠结内容：即使截图内容逆天、擦边、露骨，也会直接发送，最多用一句吐槽带过。v2.9 起新增「语录统计」：管理页右上角可打开统计弹窗，查看语录总量、已归属比例、语义化覆盖率、最近 30 天新增趋势、各群概览，以及按人物统计的语录数量排名和投稿人排名；群内发送「/语录排行」可直接查看本群排名。v2.9.1 起，识别归属时会忽略 LV 等级、群头衔和管理员徽章，这类文本不会再被当成昵称；「整理旧别名」会清理已有的头衔别名并解除相应的错误归属。v2.9.2 起 AI 召回支持点名：群友说「发一张某某的语录」时，会先按 QQ 号再按该 QQ 的昵称/别名识别这个人，把已确认归属到他名下的语录直接放进候选。v2.9.3 起每 24 小时自动同步一次群成员身份（周期可在「语录人物」页面调整或暂停），显示上次/下次同步时间。v2.9.4 起更新后会向配置的群聊推送本次更新日志（v3.0.1 起默认关闭，需显式配置目标群与桥接 token，不再内置群号、不再读取其他插件配置）。v2.9.5 起更新推送后会在对应群聊的 AI 上下文注入近况提示（版本、时间、要点），群友追问时可自然衔接。v2.9.6 起 AI 可直接查询语录统计（quote_stats），排名按人物合并，同一群友的多个昵称不会被分开计数。v2.10 起人物档案使用 pid 编号（列表/档案/合并/拆分/统计统一），同一个人改名或换号后记录仍归在同一个 pid 下。v2.11 起所有元数据存进 SQLite 数据库（quote.db），读写更快、支持单文件备份，旧版 JSON 会自动迁移；如需备份，连同 quote.db 与图片目录一起打包即可。v2.12 起补全群内命令：「/语录 @某人」「/语录 关键词」可按人物或关键词取图，「/语录详情 序号」看单条详情，「/合集 名称」发合集里的图，「/周报」查看本周统计；管理页新增「专题合集」和「每周语录周报」设置。v2.12 起 AI 召回可点名人物，并可查询合集归属与本周周报。v2.12.1 起周报渲染为带头像的表格图片：群内「/周报」直接发图，回复「/周报 上周」可看上一周；管理页「语录统计」的排行与各群概览改为带头像的表格。v2.12.2 起 AI 召回最多返回 3 条精简候选（id/who/pid/caption/tags/tone），并附带最近已发过的图与 sent_ago 标记，避免同一张图反复发送；「/语录排行」支持按月（本月 / 上月）。v2.12.3 起 AI 工具合并为单个 quote（action=recall|stats|weekly），召回候选精简到 3 条、只带 id/who/caption/tags，并新增最近已发图记忆、召回缓存（5 分钟）与召回提示节流（30 分钟）。v2.13 起管理页搜索框支持全文检索（FTS5），并可按人物、标签、时间范围组合筛选；删除的语录会先进入「回收站」，可恢复或彻底删除，回收站保留天数可在群设置里调整；「扫描待打标签」会把还没有标签的语录加入后台队列，由视觉模型自动补标签（可在群设置里关闭自动打标签或暂停任务）。v2.14 起管理页右上角新增「数据可视化」：时段热力图（星期 × 小时）、最近半年的发帖日历、人物时间线与年度报告预览；群内发送「/年度报告」可生成自己的年度语录报告图片，也可「/年度报告 @某人」或「/年度报告 昵称 2026」查看他人。v2.14.1 改进更新推送：按条列出精简后的更新要点，条目过多时保留前 6 条并提示查看完整日志，不再只发一句「细节见更新日志」。v2.15.0 起可自动学习群友俗名：在「语录人物」页的「待确认俗名」里确认或忽略候选，确认后 AI 召回与归属识别都能用这个称呼找到人；群设置里可开关自动学习、调整学习间隔，也可手动点「立即学习」。v2.16.0 起每 24 小时自动语义化一次新语录（周期可在群设置里改）；确认归属、记录与展示时优先使用确认俗名，其次是 QQ 当前昵称/群名片；设置面板新增「重填全部语录归属」，可一次性按新称呼刷新全部归属与语义 speaker。v2.17.0 起管理页改为「左侧模块导航 + 独立模块页面」：01 语录库、02 语录人物、03 语录统计、04 专题合集、05 数据可视化、06 回收站，各模块的按钮按职责分组排列；页面视觉同步换新（纸感底色、墨黑与荧光黄绿、细线与编号标签），并优化按钮的悬停/按下/禁用/键盘焦点状态。v2.17.1 起模块改用圆角卡片与不透明底色，避免跟随浏览器背景变色；配色、圆角与渐变参数直接取自模板 PPT 。 发送「/限制级」可查看限制级语录；默认只展示非限制级。 v2.20.0 起维护成员、邀请令牌与审计撤销也可在管理页「协作维护」里操作。 v2.20.1 起协作维护页支持点击缩略图查看大图（人物/标签/语义状态）、按最新或最早排序、按归属筛选；管理页复制邀请链接在沙箱环境下改为选中兜底。 v2.20.2 起协作维护页的图片查看面板内置编辑操作：可直接在面板里标/取消限制级、搜索并归属人物或清除归属，管理角色还可重新语义化。 v2.20.3：角色合并为维护员；查看面板可编辑标签。 v2.20.4：标签改为独立词条（逐个增删）。 v2.20.5 起重新语义化可填写参考意见。"
